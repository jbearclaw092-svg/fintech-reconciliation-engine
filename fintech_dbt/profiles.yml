fintech_dbt:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: ACCOUNTADMIN
      database: FINTECH_CI_TEST_DB
      warehouse: FINTECH_RECON_WH
      schema: CI_BUILD
      threads: 4
